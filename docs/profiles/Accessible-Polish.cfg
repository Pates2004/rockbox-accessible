# Optional profile: import once through Files / Pliki.
# It enables Polish Talkbox and touch exploration on supported players.
# Factory R1 Power triple-click activates the accessibility service group.
lang: /.rockbox/langs/polski.lng
talk menu: off
talk dir: spell
talk file: spell
talk dir clip: off
talk file clip: off
tts enabled: on
tts language: system
accessibility shortcut enabled: on
accessibility shortcut tts: on
accessibility shortcut voice files: off
accessibility shortcut touch: on
accessibility shortcut curtain: off
accessibility touch enabled: on
